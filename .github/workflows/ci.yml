# The same gates the git hooks run locally, run again where nobody can skip
# them: a hook is a courtesy to the person committing, CI is the rule.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: `prepare` installs the git hooks, which a CI
      # checkout has no use for.
      - run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint -- --deny-warnings

      - name: Formatting
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Tests, with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Keep the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Every commit in the pull request is conventional
        run: >
          npx commitlint --config config/commitlint.config.js --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
