<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7ec8e3" />
    <title>Kitsos Island - Playable CV</title>
    <meta
      name="description"
      content="An explorable 3D island CV for Kitsos Orfanopoulos, Senior Full Stack Software Engineer & Technical Lead, Athens, Greece."
    />
    <meta property="og:title" content="Kitsos Island - Playable CV" />
    <meta
      property="og:description"
      content="Walk a Pokémon-style island, meet the townspeople and learn about Kitsos Orfanopoulos. Contact him from the Radio Center."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kitsos Island" />
    <meta property="og:url" content="https://www.kitsorfan.com/" />
    <!-- Absolute, because link previews are fetched from somewhere else.
         Redrawn with `npm run og:image`. -->
    <meta
      property="og:image"
      content="https://www.kitsorfan.com/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Christos (Kitsos) Orfanopoulos, Senior Software Engineer and Technical Lead, beside a cartoon island with a lighthouse."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://www.kitsorfan.com/" />
  </head>
  <body>
    <!--
      For whatever does not run the island: crawlers that read the HTML and
      stop, and browsers with scripts off. Both get the plain CV, which says
      everything the island does. Fixed on top, since the page itself never
      scrolls.
    -->
    <noscript>
      <div
        style="
          position: fixed;
          inset: 0;
          z-index: 1;
          overflow: auto;
          padding: 2rem 1.25rem;
          background: #7ec8e3;
          font-family: 'Trebuchet MS', system-ui, sans-serif;
          color: #241c2e;
        "
      >
        <div
          style="
            max-width: 36rem;
            margin: 0 auto;
            padding: 1.5rem 1.75rem;
            background: #fdf7e9;
            border: 3px solid #2a2033;
            border-radius: 14px;
          "
        >
          <h1 style="margin-top: 0">Christos (Kitsos) Orfanopoulos</h1>
          <p>Senior Software Engineer &amp; Technical Lead, Athens, Greece.</p>
          <p>
            Kitsos Island is a 3D CV you walk around, and it needs JavaScript.
            Everything on it is also here as plain pages:
          </p>
          <ul>
            <li><a href="/cv.html">The full CV</a></li>
            <li>
              <a href="/Orfanopoulos-Christos-CV.pdf"
                >The two-page CV, as a PDF</a
              >
            </li>
            <li>
              <a href="https://linkedin.com/in/kitsorfan/">LinkedIn</a> ·
              kitsorfan@protonmail.com
            </li>
          </ul>
        </div>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
